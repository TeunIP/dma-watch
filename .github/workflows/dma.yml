name: DMA Watch fetch

on:
  schedule:
    - cron: "30 5 * * 1-5"    # weekdays 05:30 UTC (07:30 CEST / 06:30 CET), before the EU open
    - cron: "20 20 * * 1-5"   # weekdays 20:20 UTC, after the US close in summer time (22:20 CEST)
    - cron: "20 21 * * 1-5"   # weekdays 21:20 UTC, after the US close in winter time (22:20 CET)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute moving averages
        run: python fetch.py
      - name: Commit data/latest.json
        run: |
          git config user.name "dma-watch-bot"
          git config user.email "dma-watch-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "DMA data $(date -u +%F)" || echo "no changes"
          git push
