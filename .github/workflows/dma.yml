name: DMA Watch fetch

on:
  schedule:
    - cron: "15 4 * * 4"   # Thursday 04:15 UTC, before European markets open
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute moving averages
        run: python fetch.py
      - name: Commit data/latest.json
        run: |
          git config user.name "dma-watch-bot"
          git config user.email "dma-watch-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "DMA data $(date -u +%F)" || echo "no changes"
          git push
